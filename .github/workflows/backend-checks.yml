name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-checks.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'api/**'
      - 'db/**'
      - 'tests/**'
      - 'web/**'
      - 'scripts/check-source.mjs'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_claw_checks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: authored-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d business_claw_checks"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BC_DISPOSABLE_DB: business-claw-backend-ci-v1
      PG_TEST_URL: postgresql://postgres:authored-ci-only@127.0.0.1:5432/business_claw_checks
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - name: Install pinned dependency lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused domain Auth HTTP client and real-transaction checks
        run: >-
          node --test --test-reporter=tap --test-concurrency=1
          tests/domain.test.mjs tests/runtime-config.test.mjs tests/server-policy.test.mjs
          tests/auth-http.test.mjs tests/server-client.test.mjs tests/postgres-store.test.mjs
      - name: Static source validation
        run: npm run build
