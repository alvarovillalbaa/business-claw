name: Hosted HTTP checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-http-checks.yml'
      - 'scripts/check-hosted-endpoints.mjs'

permissions:
  contents: read

jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - name: Three public read-only requests without credentials
        run: node scripts/check-hosted-endpoints.mjs
