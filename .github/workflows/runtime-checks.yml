name: Runtime source checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-checks.yml'
      - 'runtime/compute-provider.mjs'
      - 'runtime/artifact-admission.mjs'
      - 'server/runtime-ledger.mjs'
      - 'db/runtime-ledger.sql'
      - 'tests/unit/compute-provider.test.mjs'
      - 'tests/unit/artifact-admission.test.mjs'
      - 'tests/integration/runtime-ledger.test.mjs'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_claw_runtime_checks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: authored-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d business_claw_runtime_checks"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BC_DISPOSABLE_DB: business-claw-runtime-ci-v1
      PG_RUNTIME_TEST_URL: postgresql://postgres:authored-ci-only@127.0.0.1:5432/business_claw_runtime_checks
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - name: Install pinned lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Provider artifact and durable-journal cases without live services
        run: >-
          node --test --test-reporter=tap --test-concurrency=1
          tests/unit/compute-provider.test.mjs tests/unit/artifact-admission.test.mjs
          tests/integration/runtime-ledger.test.mjs
      - name: Static source validation
        run: node scripts/check-source.mjs
  registry-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - name: Read bounded anonymous GHCR metadata without image layers
        run: node --input-type=module < docs/research/2026-10-31/openclaw-registry-probe.mjs.example
